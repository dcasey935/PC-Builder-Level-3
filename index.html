<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder - Master Working Version</title>
    <style>
        :root {
            --bg-dark: #070d11;
            --panel-bg: #0e1922;
            --panel-border: #1e3a4c;
            --accent-teal: #00e5ff;
            --accent-dim: #005f73;
            --text-main: #e0f2fe;
            --text-muted: #7dd3fc;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, system-ui, -apple-system;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.1);
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--panel-border);
            font-size: 14px;
        }

        .round-indicator {
            color: var(--text-muted);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-display {
            color: var(--accent-teal);
            font-weight: bold;
            font-size: 18px;
        }

        .dashboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #04080a;
            border-bottom: 1px solid var(--panel-border);
            font-size: 12px;
        }

        .heat-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            margin-right: 15px;
        }

        .heat-label {
            color: var(--warning);
            font-weight: bold;
        }

        .heat-bar-bg {
            flex-grow: 1;
            height: 10px;
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .heat-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-teal);
            transition: width 0.3s ease, background 0.3s ease;
        }

        .controls-right {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--panel-border);
            border: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent-dim);
        }

        .play-area {
            display: grid;
            grid-template-columns: 130px 1fr;
            min-height: 400px;
            position: relative;
        }

        .sidebar {
            background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--panel-border);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 400px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .part-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .part-card:hover {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.05);
        }

        .part-card.selected-tap {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .part-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .part-name {
            font-size: 9px;
            color: var(--text-main);
            font-weight: bold;
        }

        .workspace {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            background: radial-gradient(circle at center, #0f2230 0%, #070d11 100%);
        }

        .motherboard {
            width: 100%;
            height: 100%;
            background: #0a1722;
            border: 2px dashed var(--panel-border);
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(auto-fill, minmax(55px, 1fr));
            gap: 8px;
            padding: 10px;
            position: relative;
            overflow-y: auto;
            max-height: 380px;
        }

        .board-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.04);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            pointer-events: none;
        }

        .socket {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed var(--panel-border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: all 0.2s;
            position: relative;
            min-height: 55px;
        }

        .socket.highlight {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.08);
        }

        .socket.filled {
            border-style: solid;
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .socket-title {
            font-size: 9px;
            color: var(--text-muted);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .socket-content {
            font-size: 10px;
            font-weight: bold;
            color: var(--success);
            text-align: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 13, 17, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 20;
            display: none;
        }

        .overlay.active {
            display: flex;
        }

        /* Setup and diagnostic activities can be taller than the game window. */
        #quizOverlay {
            justify-content: flex-start;
            overflow-y: auto;
            padding: 18px 12px;
        }
        #quizOverlay .quiz-choices { max-width: 410px; }
        .quiz-btn:disabled { opacity: .65; cursor: default; }
        .setup-info { color: var(--text-muted); font-size: 11px; line-height: 1.5;
            text-align: left; padding: 10px; border: 1px solid var(--panel-border);
            border-radius: 4px; width: 100%; }
        .setup-status { color: var(--warning); font-size: 11px; text-align: left; }
        .mission-panel { color: var(--text-muted); font-size: 11px; line-height: 1.5;
            padding: 7px; border: 1px solid var(--panel-border); border-radius: 5px; }
        .mission-panel button { width: 100%; margin-top: 8px; }

        .overlay h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: var(--accent-teal);
        }

        .overlay.overheat h2 {
            color: var(--danger);
            font-size: 26px;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 240px;
        }

        .btn {
            background: var(--accent-teal);
            color: var(--bg-dark);
            border: none;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
        }

        .btn-secondary:hover {
            background: rgba(0, 229, 255, 0.1);
        }

        .quiz-choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 16px;
        }

        .quiz-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            text-align: left;
            transition: all 0.2s;
        }

        .quiz-btn:hover {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.1);
        }

        .guide-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 30;
            display: flex;
            flex-direction: column;
            padding: 16px;
            display: none;
        }

        .guide-modal.active {
            display: flex;
        }

        .guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .guide-content {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .guide-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px;
        }

        .guide-section-title {
            color: var(--accent-teal);
            font-size: 13px;
            margin: 12px 0 4px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
        }

        .guide-item ul {
            padding-left: 17px;
            margin-top: 7px;
        }

        .guide-item li {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.55;
            margin-bottom: 6px;
            user-select: text;
        }

        .guide-item p, .guide-item h4 { user-select: text; }

        .guide-item h4 {
            color: var(--accent-teal);
            font-size: 12px;
            margin-bottom: 2px;
        }

        .guide-item p {
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.3;
        }

        .footer-brand {
            padding: 6px;
            text-align: center;
            font-size: 10px;
            color: var(--panel-border);
            background: #04080a;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        svg.icon-svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-teal);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Level 3 has no timer, so hide Pause only during Level 3. */
        .game-container.level3-mode #pauseBtn { display: none; }
        .game-container.level3-mode #bgmToggleBtn { display: none; }
        /* Keep the pause dialog above Level 3 questions, but below the original dashboard. */
        .game-container.level3-mode #mainOverlay.level3-pause { z-index: 35; }
        /* Level 3: leave the original Level 1 dashboard uncovered and clickable. */
        .game-container.level3-mode .overlay {
            top: var(--level3-overlay-top);
            height: calc(100% - var(--level3-overlay-top));
        }

        /* Level 3 loading display, inspired by the supplied reference image. */
        .level3-progress-wrap { width: min(72%, 420px); margin: 8px auto 16px; padding: 8px 12px 12px; text-align: center; border-radius: 16px; background: #000; border: 2px solid #65e9ff; box-sizing: border-box; }
        .game-container:not(.level3-mode) .level3-progress-wrap { display: none !important; }
        .level3-loading-heading { color: #62eaff; font-weight: 900; font-size: clamp(17px, 2.4vw, 25px); letter-spacing: 3px; line-height: 1.3; text-shadow: 0 0 7px rgba(98,234,255,.55); }
        .level3-loading-dots::after { content: ''; animation: level3Dots 1.35s steps(4,end) infinite; }
        @keyframes level3Dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%,100% { content: '...'; } }
        .level3-progress-track { height: 27px; border: 3px solid #65e9ff; border-radius: 13px; padding: 4px; overflow: hidden; background: #000; margin: 8px 0; box-shadow: 0 0 6px rgba(98,234,255,.65); box-sizing: border-box; }
        .level3-progress-fill { width: 0%; height: 100%; border-radius: 7px; background: repeating-linear-gradient(125deg,#62eaff 0px,#62eaff 11px,#5a78a5 11px,#5a78a5 19px); background-size: 44px 44px; transition: width .35s ease; animation: level3Stripe 1.1s linear infinite; }
        @keyframes level3Stripe { from { background-position: 0 0; } to { background-position: 44px 0; } }
        .level3-progress-percent { color: #62eaff; font-weight: 900; font-size: clamp(22px, 3vw, 34px); line-height: 1.15; text-shadow: 0 0 7px rgba(98,234,255,.45); }
        .level3-progress-detail { color: #c9f5ff; font-size: 12px; margin-top: 4px; letter-spacing: 1px; }
        @media (prefers-reduced-motion: reduce) { .level3-loading-dots::after, .level3-progress-fill { animation: none; } .level3-loading-dots::after { content: '...'; } }

        /* Level 3 Mission 2 only: critical-to-healthy system status. */
        .level3-progress-wrap.system-status .level3-loading-heading { color: #ff5252; text-shadow: none; }
        .level3-progress-wrap.system-status .level3-progress-track { border-color: #ff5252; box-shadow: 0 0 6px rgba(255,82,82,.45); }
        .level3-progress-wrap.system-status .level3-progress-fill { background: #e53e3e; animation: none; transition: width .35s ease, background-color .35s ease; }
        .level3-progress-wrap.system-status .level3-progress-percent { color: #ff5252; text-shadow: none; }
        .level3-progress-wrap.system-status.status-yellow .level3-loading-heading,
        .level3-progress-wrap.system-status.status-yellow .level3-progress-percent { color: #ffcf40; }
        .level3-progress-wrap.system-status.status-yellow .level3-progress-track { border-color: #ffcf40; box-shadow: 0 0 6px rgba(255,207,64,.45); }
        .level3-progress-wrap.system-status.status-yellow .level3-progress-fill { background: #ffcf40; }
        .level3-progress-wrap.system-status.status-green .level3-loading-heading,
        .level3-progress-wrap.system-status.status-green .level3-progress-percent { color: #35db76; }
        .level3-progress-wrap.system-status.status-green .level3-progress-track { border-color: #35db76; box-shadow: 0 0 6px rgba(53,219,118,.45); }
        .level3-progress-wrap.system-status.status-green .level3-progress-fill { background: #35db76; }
        .level3-progress-wrap.system-status .level3-loading-dots { display: none; }
        /* Mission 2 is a fully filled, flashing health bar. Correct answers
           convert red segments to yellow, then green; blinking stops at 100%. */
        .level3-progress-wrap.system-status { border-color: #ff5252; }
        .level3-progress-wrap.system-status .level3-progress-track {
            background: #e53e3e;
            animation: systemCriticalBlink var(--system-blink-duration, .65s) ease-in-out infinite;
        }
        .level3-progress-wrap.system-status .level3-progress-fill {
            width: 100% !important;
            background: linear-gradient(to right,
                #35db76 0%, #35db76 var(--system-recovery, 0%),
                #e53e3e var(--system-recovery, 0%), #e53e3e 100%);
            animation: none;
            transition: background-color .35s ease;
        }
        .level3-progress-wrap.system-status.status-yellow .level3-progress-fill {
            background: linear-gradient(to right,
                #35db76 0%, #35db76 var(--system-recovery, 0%),
                #ffcf40 var(--system-recovery, 0%), #ffcf40 100%);
        }
        .level3-progress-wrap.system-status.status-green .level3-progress-fill {
            background: linear-gradient(to right,
                #35db76 0%, #35db76 var(--system-recovery, 0%),
                #35db76 var(--system-recovery, 0%), #35db76 100%);
        }
        .level3-progress-wrap.system-status.status-yellow { border-color: #ffcf40; }
        .level3-progress-wrap.system-status.status-green { border-color: #35db76; }
        .level3-progress-wrap.system-status.system-stable .level3-progress-track { animation: none; }
        @keyframes systemCriticalBlink { 0%,100% { opacity: 1; } 50% { opacity: .38; } }
        @media (prefers-reduced-motion: reduce) {
            .level3-progress-wrap.system-status .level3-progress-track { animation: none; }
        }
        /* Mission 2: 16 separate red-to-green segments, matching the reference. */
        .level3-progress-wrap.system-status .level3-progress-track {
            position: relative; height: 39px; padding: 0; border: 5px solid #080808;
            border-radius: 0; overflow: hidden; background: #000;
            box-shadow: 0 0 0 1px #454545; animation: none;
        }
        .level3-progress-wrap.system-status .level3-progress-fill {
            position: absolute; inset: 0; width: 100% !important; height: 100%; border-radius: 0;
            background: repeating-linear-gradient(to right, transparent 0, transparent calc(6.25% - 3px), #050505 calc(6.25% - 3px), #050505 6.25%),
              linear-gradient(to right, #ff1825 0%, #ff4c26 17%, #ff9130 34%, #ffd437 56%, #e7ee22 75%, #78d500 100%) !important;
            animation: none !important;
        }
        /* Unrecovered segments pulse; each correct answer moves the pulse boundary right. */
        .level3-progress-wrap.system-status .level3-progress-track::after {
            content: ''; position: absolute; top: 0; bottom: 0; right: 0;
            width: calc(100% - var(--system-recovery, 0%));
            background: rgba(0,0,0,.26); pointer-events: none;
            animation: segmentedWarningBlink var(--system-blink-duration, .65s) ease-in-out infinite;
            transition: width .35s ease;
        }
        .level3-progress-wrap.system-status.system-stable .level3-progress-track::after { display: none; }
        @keyframes segmentedWarningBlink { 0%,100% { opacity: .15; } 50% { opacity: .95; } }
        @media (prefers-reduced-motion: reduce) {
            .level3-progress-wrap.system-status .level3-progress-track::after { animation: none; opacity: .55; }
        }

        /* Mission 2: remove colored segments from red through green with every correct answer. */
        .level3-progress-wrap.system-status .level3-progress-fill {
            inset: 0; width: 100% !important;
            background: repeating-linear-gradient(to right, transparent 0, transparent calc(6.25% - 3px), #050505 calc(6.25% - 3px), #050505 6.25%),
              linear-gradient(to right, #ff1825 0%, #ff4c26 17%, #ff9130 34%, #ffd437 56%, #e7ee22 75%, #78d500 100%) !important;
            clip-path: inset(0 0 0 var(--system-recovery, 0%));
            transition: clip-path .4s ease;
        }
        .level3-progress-wrap.system-status .level3-progress-track::after { display: none !important; }
        .level3-progress-wrap.system-status .level3-progress-track {
            animation: criticalBarPulse .8s ease-in-out infinite !important;
            border-color: #080808 !important; box-shadow: 0 0 0 1px #454545 !important;
        }
        .level3-progress-wrap.system-status .level3-loading-heading {
            color: #ff5252 !important; animation: criticalHeadingPulse .8s ease-in-out infinite;
        }
        .level3-progress-wrap.system-status.system-stable .level3-progress-track,
        .level3-progress-wrap.system-status.system-stable .level3-loading-heading { animation: none !important; }
        .level3-progress-wrap.system-status.system-stable .level3-loading-heading { color: #35db76 !important; }
        .level3-progress-wrap.system-status .level3-progress-percent,
        .level3-progress-wrap.system-status .level3-progress-detail { display: none !important; }
        @keyframes criticalBarPulse { 0%,100% {opacity:1} 50% {opacity:.32} }
        @keyframes criticalHeadingPulse { 0%,100% {opacity:1} 50% {opacity:.45} }
        @media (prefers-reduced-motion: reduce) {
            .level3-progress-wrap.system-status .level3-progress-track,
            .level3-progress-wrap.system-status .level3-loading-heading { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <span class="round-indicator" id="roundLabel">ROUND 1</span>
            <span class="score-display"><span id="scoreVal">0</span> PTS</span>
        </div>

        <div class="dashboard">
            <div class="heat-container">
                <span class="heat-label">HEAT</span>
                <div class="heat-bar-bg">
                    <div class="heat-bar-fill" id="heatFill"></div>
                </div>
            </div>
            <div class="controls-right">
                <button class="icon-btn" id="bgmToggleBtn" title="Toggle Arcade Music">🎵</button>
                <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound Effects">🔊</button>
                <button class="icon-btn" id="guideBtn" title="Learning & Review Guide">📖</button>
                <button class="icon-btn" id="pauseBtn" title="Pause Game">⏸</button>
            </div>
        </div>

        <div class="play-area">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-title">Parts Tray</div>
            </div>

            <div class="workspace">
                <div class="motherboard" id="motherboard">
                    <div class="board-label">BOARD</div>
                </div>
            </div>
        </div>

        <!-- Main Intro / State Overlay -->
        <div class="overlay active" id="mainOverlay">
            <h2 id="overlayTitle">PC BUILDER TRAINING</h2>
            <p id="overlayDesc">Install all 13 components across 3 progressive rounds, pass mini-quizzes, and conquer the final Master Quiz!</p>
            <div class="btn-group">
                <button class="btn" id="overlayBtn">PLAY NOW</button>
                <button class="btn btn-secondary" id="introGuideBtn">STUDY & REVIEW</button>
            </div>
        </div>

        <!-- Mini / Final Quiz Overlay -->
        <div class="overlay" id="quizOverlay">
            <h2 id="quizTitle">QUICK MINI-QUIZ (1.5x PTS)</h2>
            <p id="quizQuestion">Loading question...</p>
            <div class="quiz-choices" id="quizChoices"></div>
        </div>

        <!-- Part Guide Modal -->
        <div class="guide-modal" id="guideModal">
            <div class="guide-header">
                <h3>LEARNING & REVIEW GUIDE</h3>
                <button class="icon-btn" id="closeGuideBtn">✕</button>
            </div>
            <div class="guide-content" id="guideContentList"></div>
        </div>

        <div class="footer-brand">PC Builder Basics • 13-Part Campaign Edition</div>
    </div>

    <script>

     quizChoices.innerHTML = '';
     const feedback = document.createElement('p');
     feedback.className = 'setup-status';
     options.forEach(option => {
         const btn = document.createElement('button');
         btn.className = 'quiz-btn';
         btn.textContent = option.text;
         btn.addEventListener('click', () => {
             if (!option.correct) {
                 playSound('click');
                 feedback.textContent = option.feedback;
                 return;
             }
             playSound('success');
             quizQuestion.textContent = option.feedback;
             quizChoices.innerHTML = '';
             const next = document.createElement('button');
             next.className = 'btn';
             next.textContent = 'CONTINUE';
             next.addEventListener('click', onCorrect);
             quizChoices.appendChild(next);
         });
         quizChoices.appendChild(btn);
     });
     quizChoices.appendChild(feedback);

function updateLevel3Progress(done, total, label) {
  let meter = document.getElementById('level3Progress');
  if (!meter) {
    meter = document.createElement('div');
    meter.id = 'level3Progress';
    meter.className = 'level3-progress-wrap';
    meter.innerHTML = '<div class="level3-loading-heading">LOADING<span class="level3-loading-dots" aria-hidden="true"></span></div><div class="level3-progress-track" role="progressbar" aria-label="Correct answers completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="level3-progress-fill" id="level3ProgressFill"></div></div><div class="level3-progress-percent" id="level3ProgressPercent">0%</div><div class="level3-progress-detail"><span id="level3ProgressName"></span> — <span id="level3ProgressCount"></span></div>';
    quizQuestion.parentNode.insertBefore(meter, quizQuestion);
  }
  const percent = Math.round(100 * done / total);
  const isMission2 = label === 'MISSION 2';
  meter.classList.toggle('system-status', isMission2);
  meter.classList.remove('status-yellow', 'status-green', 'system-stable');
  document.getElementById('level3ProgressName').textContent = label;
  document.getElementById('level3ProgressCount').textContent = done + ' / ' + total + ' CORRECT';
  document.getElementById('level3ProgressFill').style.width = isMission2 ? '100%' : percent + '%';
  const heading = meter.querySelector('.level3-loading-heading');
  const percentLabel = document.getElementById('level3ProgressPercent');
  if (isMission2) {
    // The bar fills as correct answers repair the system; severity drops from 100% to 0%.
    const critical = 100 - percent;
    const status = critical === 0 ? 'SYSTEM STABLE' : critical <= 30 ? 'SYSTEM HEALTHY' : critical <= 60 ? 'SYSTEM WARNING' : 'SYSTEM CRITICAL';
    if (critical <= 60 && critical > 30) meter.classList.add('status-yellow');
    if (critical <= 30) meter.classList.add('status-green');
    meter.style.setProperty('--system-recovery', percent + '%');
    meter.style.setProperty('--system-blink-duration', critical > 60 ? '.65s' : critical > 30 ? '1.35s' : '0s');
    meter.classList.toggle('system-stable', critical === 0);
    heading.textContent = critical === 0 ? 'SYSTEM STABLE' : 'SYSTEM CRITICAL';
    percentLabel.textContent = '';
    meter.querySelector('[role="progressbar"]').setAttribute('aria-label', 'System recovery completed');
  } else {
    heading.innerHTML = 'LOADING<span class="level3-loading-dots" aria-hidden="true"></span>';
    percentLabel.textContent = percent + '%';
    meter.querySelector('[role="progressbar"]').setAttribute('aria-label', 'Correct answers completed');
  }
  meter.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', percent);
}

                    }
                });
                quizChoices.appendChild(btn);
            });
        }

        // RANDOMIZATION: Fisher-Yates shuffle makes a new independent copy.
        // This changes the order without changing the original answer key.
        function shuffleItems(items) {
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // FINAL EXAM: Shuffle both question order and answer placement.
        // Each answer retains its correct/incorrect flag after shuffling.
        function triggerFinalTestStep() {
            quizOverlay.classList.add('active');
            quizTitle.textContent = `ULTIMATE FINAL EXAM (${gameState.finalTestIndex + 1} / ${gameState.examQuestions.length})`;
            const quiz = gameState.examQuestions[gameState.finalTestIndex];
            quizQuestion.textContent = quiz.q;
            quizChoices.innerHTML = '';

            const answers = shuffleItems(quiz.choices.map((label, index) => ({
                label,
                correct: index === quiz.correct
            })));

            answers.forEach(answer => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = answer.label;
                btn.addEventListener('click', () => {
                    const advanceExam = () => {
                        quizOverlay.classList.remove('active');
                        gameState.finalTestIndex++;
                        if (gameState.finalTestIndex < gameState.examQuestions.length) {
                            triggerFinalTestStep();
                        } else {
                            showVictoryModal();
                        }
                    };
                    if (answer.correct) {
                        playSound('success');
                        gameState.score += 150;
                        scoreVal.textContent = gameState.score;
                        advanceExam();
                    } else {
                        // topicId travels with the question, even after shuffling.
                        showIncorrectAnswerReview(quiz, quiz.topicId, advanceExam);
                    }
                });
                quizChoices.appendChild(btn);
            });
        }

    function openSetupActivity(partId) {
        const activity = SETUP_ACTIVITIES[partId];

        let stepIndex = 0;
        quizOverlay.classList.add('active');
        function showStep() {
            const step = activity.steps[stepIndex];
            quizTitle.textContent = activity.title + ` (${stepIndex + 1}/${activity.steps.length})`;
            quizQuestion.textContent = step.prompt;
            quizChoices.innerHTML = '';
            if (stepIndex === 0) {
                const intro = document.createElement('div');
                intro.className = 'setup-info';
                intro.textContent = activity.intro;
                quizChoices.appendChild(intro);
            }
            const feedback = document.createElement('p');
            feedback.className = 'setup-status';
            step.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = choice;
                btn.addEventListener('click', () => {
                    if (index !== step.correct) {
                        playSound('click');
                        feedback.textContent = 'Not quite. Consider the purpose of the connection and try again.';
                        return;
                    }
                    playSound('success');
                    quizChoices.innerHTML = '';
                    quizQuestion.textContent = step.why;
                    const next = document.createElement('button');
                    next.className = 'btn';
                    next.textContent = stepIndex === activity.steps.length - 1 ? 'FINISH SETUP (+100 PTS)' : 'NEXT CHECK';
                    next.addEventListener('click', () => {
                        stepIndex++;
                        if (stepIndex === activity.steps.length) finishRound3Activity(partId);
                        else showStep();
                    });
                    quizChoices.appendChild(next);
                });
                quizChoices.appendChild(btn);
            });
            quizChoices.appendChild(feedback);
        }
        showStep();
    }

        });

        quizChoices.appendChild(button);
    });
